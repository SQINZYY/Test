<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Unterwegs</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 1. Planen -->
  <section id="view-plan" class="view active" aria-label="Route planen">
    <header class="appbar hero">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.9 5.1h8.5a3.9 3.9 0 0 1 0 7.7H6.9a3.9 3.9 0 0 0 0 7.7h9.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="3.9" cy="5.1" r="2.4" fill="#0f766e" stroke="currentColor" stroke-width="2"/><circle cx="18.9" cy="20.5" r="3" fill="#fde68a"/></svg></span>
        <div>
          <h1>Unterwegs</h1>
          <p>Bus, Bahn, Zug, Rad, Auto &amp; zu Fuß</p>
        </div>
      </div>
      <button id="btn-settings" class="icon-btn on-hero" aria-label="Einstellungen" data-icon="tune"></button>
    </header>

    <main class="content">
      <div class="card where" id="where">
        <div class="field" id="field-from">
          <span class="pin start" aria-hidden="true"></span>
          <label class="sr" for="in-from">Start</label>
          <input id="in-from" type="text" inputmode="search" enterkeyhint="next" placeholder="Start: Adresse, Haltestelle, Ort" autocomplete="off" spellcheck="false">
          <button class="icon-btn small star" data-star="from" aria-label="Als Favorit speichern" hidden></button>
          <button class="icon-btn small clear" data-clear="from" aria-label="Start leeren" data-icon="close" hidden></button>
          <button id="btn-locate" class="icon-btn small" aria-label="Mein Standort" data-icon="locate"></button>
        </div>
        <div class="where-line">
          <span class="dots" aria-hidden="true"></span>
          <button id="btn-swap" class="swap" aria-label="Start und Ziel tauschen" data-icon="swap"></button>
        </div>
        <div class="field" id="field-to">
          <span class="pin end" aria-hidden="true"></span>
          <label class="sr" for="in-to">Ziel</label>
          <input id="in-to" type="text" inputmode="search" enterkeyhint="search" placeholder="Ziel: Adresse, Haltestelle, Ort" autocomplete="off" spellcheck="false">
          <button class="icon-btn small star" data-star="to" aria-label="Als Favorit speichern" hidden></button>
          <button class="icon-btn small clear" data-clear="to" aria-label="Ziel leeren" data-icon="close" hidden></button>
        </div>
        <div id="suggest" class="suggest" role="listbox" hidden></div>
      </div>

      <div id="favs" class="favs" role="group" aria-label="Favoriten – antippen setzt das Ziel"></div>

      <h2 class="section-title">Womit willst du unterwegs sein?</h2>
      <div id="modes" class="modes" role="group" aria-label="Verkehrsmittel"></div>
      <p id="mode-hint" class="hint"></p>

      <h2 class="section-title">Wann?</h2>
      <div class="card when">
        <div class="when-row">
          <div class="when-label"><span data-icon="walk"></span>Losgehen</div>
          <div class="segmented" id="dep-type" role="radiogroup" aria-label="Losgehen">
            <button type="button" data-v="now" class="on" role="radio" aria-checked="true">Jetzt</button>
            <button type="button" data-v="from" role="radio" aria-checked="false">Ab …</button>
            <button type="button" data-v="at" role="radio" aria-checked="false">Um …</button>
          </div>
          <div id="dep-inputs" class="when-inputs" hidden>
            <label><span>Tag</span><input type="date" id="dep-date"></label>
            <label><span id="dep-time-label">Uhrzeit</span><input type="time" id="dep-time"></label>
          </div>
        </div>
        <div class="when-row">
          <div class="when-label"><span data-icon="pin"></span>Da sein</div>
          <div class="segmented" id="arr-type" role="radiogroup" aria-label="Da sein">
            <button type="button" data-v="any" class="on" role="radio" aria-checked="true">Egal</button>
            <button type="button" data-v="by" role="radio" aria-checked="false">Spätestens</button>
            <button type="button" data-v="around" role="radio" aria-checked="false">Gegen …</button>
          </div>
          <div id="arr-inputs" class="when-inputs" hidden>
            <label><span>Tag</span><input type="date" id="arr-date"></label>
            <label><span id="arr-time-label">Uhrzeit</span><input type="time" id="arr-time"></label>
          </div>
        </div>
        <p id="when-hint" class="hint when-hint"></p>
      </div>

      <button id="btn-search" class="primary big" type="button"><span data-icon="route"></span>Route berechnen</button>

      <div id="recent-box" hidden>
        <h2 class="section-title">Zuletzt gesucht</h2>
        <div id="recent" class="recent"></div>
      </div>

      <p class="credits">
        Fahrpläne &amp; Echtzeit: <a href="https://transitous.org">Transitous</a> ·
        Wege: <a href="https://valhalla.openstreetmap.de">Valhalla</a>/<a href="https://routing.openstreetmap.de">OSRM</a> (FOSSGIS) ·
        Karten &amp; Adressen: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende
      </p>
    </main>
  </section>

  <!-- 2. Ergebnisse -->
  <section id="view-results" class="view" aria-label="Verbindungen">
    <header class="appbar">
      <button class="icon-btn" data-back aria-label="Zurück" data-icon="back"></button>
      <div class="titles">
        <h1 id="res-title"></h1>
        <p id="res-sub"></p>
      </div>
      <button id="res-refresh" class="icon-btn" aria-label="Neu laden" data-icon="refresh"></button>
    </header>
    <main class="content" id="res-body"></main>
  </section>

  <!-- 3. Details -->
  <section id="view-detail" class="view" aria-label="Routendetails">
    <header class="appbar">
      <button class="icon-btn" data-back aria-label="Zurück" data-icon="back"></button>
      <div class="titles">
        <h1 id="det-title"></h1>
        <p id="det-sub"></p>
      </div>
      <button id="det-share" class="icon-btn" aria-label="Teilen" data-icon="share"></button>
    </header>
    <div id="map" class="map" aria-label="Karte"></div>
    <main class="content detail" id="det-body"></main>
  </section>

  <!-- Einstellungen -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" data-close-sheet></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title">Einstellungen</h2>
        <button class="icon-btn" data-close-sheet aria-label="Schließen" data-icon="close"></button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/core.js"></script>
  <script src="js/api.js"></script>
  <script src="js/map.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
